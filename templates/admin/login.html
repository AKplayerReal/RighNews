{% extends "base.html" %}

{% block title %}ورود{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-brand-700 to-brand-900 px-4">
  <div class="max-w-md w-full">
    <!-- لوگو -->
    <div class="text-center mb-8">
      <h1 class="text-5xl font-black text-white mb-2">
        رای‌<span class="text-yellow-400">نیوز</span>
      </h1>
      <p class="text-brand-100">پنل مدیریت</p>
    </div>

    <!-- فرم -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">ورود به حساب کاربری</h2>

      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/admin/login" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">نام کاربری</label>
          <input
            type="text"
            name="username"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
            placeholder="admin"
            autocomplete="username"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">رمز عبور</label>
          <input
            type="password"
            name="password"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"
            placeholder="••••••••"
            autocomplete="current-password"
          >
        </div>

        <button
          type="submit"
          class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg hover:shadow-xl"
        >
          ورود به پنل
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-gray-200 text-center">
        <a href="/" class="text-sm text-brand-600 hover:text-brand-700 font-medium">
          ← بازگشت به سایت
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
