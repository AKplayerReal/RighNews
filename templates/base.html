<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}رای‌نیوز | آژانس خبری هوش مصنوعی{% endblock %}</title>
  <meta name="description" content="{% block description %}ترجمه و راستی‌آزمایی خودکار مقالات علمی هوش مصنوعی به فارسی{% endblock %}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}رای‌نیوز{% endblock %}">
  <meta property="og:description" content="{% block og_description %}ترجمه و راستی‌آزمایی خودکار مقالات علمی{% endblock %}">
  {% block og_image %}{% endblock %}

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════════════════════════════
       رای‌نیوز — RighNews · main.css
       Newspaper-style Persian RTL design system
       ═══════════════════════════════════════════════════════════════════ */

    :root {
      --ink: #101a24;
      --paper: #f2f5f4;
      --paper-2: #e7ecea;
      --card: #ffffff;
      --brand: #0d5c52;
      --brand-2: #0a4740;
      --accent: #ffb020;
      --accent-2: #ffc24d;
      --signal: #e5484d;
      --mint: #129d74;
      --line: rgba(16, 26, 36, 0.14);
      --ink-soft: #46545f;
      --ink-faint: #6b7a86;

      --f-display: "Lalezar", "Vazirmatn", system-ui, sans-serif;
      --f-body: "Vazirmatn", system-ui, -apple-system, sans-serif;
      --f-mono: "IBM Plex Mono", "Courier New", monospace;

      --dots: radial-gradient(rgba(16, 26, 36, 0.07) 1px, transparent 1.3px);
      --dots-dark: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.3px);
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      color-scheme: light;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--f-body);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.9;
      background-color: var(--paper);
      background-image: var(--dots);
      background-size: 9px 9px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main { flex: 1 0 auto; }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    ::selection { background: var(--accent); color: var(--ink); }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
      border-radius: 1px;
    }

    .container {
      width: min(1180px, 100% - 2rem);
      margin-inline: auto;
    }

    .mono { font-family: var(--f-mono); }

    .skip-link {
      position: absolute;
      top: -120px;
      right: 1rem;
      background: var(--accent);
      color: var(--ink);
      padding: 0.6rem 1rem;
      font-weight: 700;
      z-index: 200;
      transition: top 0.25s ease;
    }
    .skip-link:focus { top: 1rem; }

    /* ---------------------------------------------------------------- ticker */
    .ticker {
      display: flex;
      align-items: stretch;
      background: var(--ink);
      color: var(--paper);
      overflow: hidden;
      border-bottom: 3px solid var(--accent);
    }
    .ticker-label {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      background: var(--accent);
      color: var(--ink);
      font-family: var(--f-display);
      font-size: 1.05rem;
      padding: 0.5rem 1.2rem;
      z-index: 2;
      box-shadow: -6px 0 14px rgba(0, 0, 0, 0.3);
    }
    .ticker-dot {
      width: 8px; height: 8px;
      background: var(--ink);
      border-radius: 50%;
      animation: blink 1.2s steps(1, end) infinite;
    }
    .ticker-viewport { flex: 1; overflow: hidden; display: flex; align-items: center; }
    .ticker-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      animation: tick 58s linear infinite;
      will-change: transform;
    }
    .ticker:hover .ticker-track { animation-play-state: paused; }
    .ticker-group { display: flex; align-items: center; }
    .ticker-item {
      color: #e8efec;
      font-size: 0.88rem;
      font-weight: 500;
      padding: 0.5rem 0.9rem;
      transition: color 0.2s;
    }
    .ticker-item:hover { color: var(--accent); }
    .ticker-sep { color: var(--brand); font-size: 0.55rem; opacity: 0.8; }

    /* -------------------------------------------------------------- masthead */
    .masthead {
      position: relative;
      background-color: var(--paper);
      background-image: var(--dots);
      background-size: 9px 9px;
    }
    .utility-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem 1.4rem;
      flex-wrap: wrap;
      padding: 0.55rem 0;
      border-bottom: 1px dashed var(--line);
      font-size: 0.78rem;
    }
    .u-item { color: var(--ink-soft); }
    .u-edition { font-family: var(--f-mono); letter-spacing: 0.02em; }
    .u-live {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 700;
      color: var(--brand-2);
    }
    .u-clock { margin-inline-start: 0.35rem; color: var(--mint); font-weight: 600; }

    .live-dot {
      position: relative;
      width: 9px; height: 9px;
      background: var(--mint);
      border-radius: 50%;
      display: inline-block;
    }
    .live-dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border: 2px solid var(--mint);
      border-radius: 50%;
      animation: ring 1.8s ease-out infinite;
    }

    .masthead-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1.5rem;
      padding-block: 2.2rem;
      border-bottom: 3px solid var(--ink);
    }
    .mast-side { display: flex; flex-direction: column; gap: 0.3rem; }
    .mast-left { text-align: end; }
    .mast-note { margin: 0; font-size: 0.82rem; color: var(--ink-soft); }
    .mast-note b { color: var(--brand); font-weight: 700; }
    .mast-note.mono { font-size: 0.74rem; color: var(--brand-2); }

    .mast-center { text-align: center; }
    .logo { display: inline-flex; flex-direction: column; align-items: center; gap: 0.2rem; }
    .logo-text {
      font-family: var(--f-display);
      font-size: clamp(3.6rem, 9.5vw, 7.4rem);
      line-height: 0.95;
      color: var(--ink);
      text-shadow: 0.06em 0.06em 0 rgba(13, 92, 82, 0.16);
      transition: text-shadow 0.3s ease;
    }
    .logo:hover .logo-text { text-shadow: 0.06em 0.06em 0 rgba(255, 176, 32, 0.6); }
    .logo-dot {
      display: inline-block;
      width: 0.18em; height: 0.18em;
      background: var(--accent);
      margin-inline-start: 0.12em;
      vertical-align: baseline;
      transform: translateY(-0.12em);
    }
    .logo-sub {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      letter-spacing: 0.34em;
      color: var(--brand);
      margin-top: 0.4rem;
    }
    .tagline {
      margin: 0.9rem auto 0;
      max-width: 46ch;
      font-size: 0.95rem;
      color: var(--ink-soft);
      font-weight: 500;
    }

    .nav-strip { border-bottom: 1px solid var(--ink); background: var(--paper); }
    .nav-inner { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .nav-inner a {
      position: relative;
      padding: 0.7rem 1.05rem;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--ink);
    }
    .nav-inner a::after {
      content: "";
      position: absolute;
      right: 1.05rem; left: 1.05rem; bottom: 0.35rem;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-inner a:hover { color: var(--brand); }
    .nav-inner a:hover::after { transform: scaleX(1); }

    /* --------------------------------------------------------------- top grid */
    .top-grid {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    /* lead article */
    .lead {
      position: relative;
      display: block;
      overflow: hidden;
      background: var(--ink);
      color: #fff;
      min-height: 480px;
      border: 1px solid var(--ink);
    }
    .lead-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.55;
      transform: scale(1.02);
      transition: transform 1.2s ease, opacity 0.6s ease;
      animation: kenburns 24s ease-in-out infinite alternate;
    }
    .lead:hover .lead-img { opacity: 0.66; }
    .lead-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(0deg, rgba(16, 26, 36, 0.96) 0%, rgba(16, 26, 36, 0.55) 48%, rgba(16, 26, 36, 0.2) 100%);
    }
    .lead-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 480px;
      padding: 2.4rem;
    }
    .lead-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0 0 1rem;
      align-self: flex-start;
    }
    .lead-kicker > span:first-child {
      background: var(--accent);
      color: var(--ink);
      font-family: var(--f-mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 0.28rem 0.7rem;
    }
    .lead-date {
      background: rgba(255, 255, 255, 0.12);
      color: #eef4f1;
      font-size: 0.72rem;
      padding: 0.28rem 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .lead-title {
      margin: 0;
      font-family: var(--f-display);
      font-size: clamp(1.9rem, 3.6vw, 3.3rem);
      line-height: 1.3;
      color: #fff;
      transition: color 0.3s ease;
    }
    .lead:hover .lead-title { color: var(--accent); }
    .lead-en {
      margin: 0.5rem 0 0;
      font-family: var(--f-mono);
      font-size: 0.85rem;
      color: #9fb6ad;
      direction: ltr;
      text-align: right;
    }
    .lead-excerpt {
      margin: 0.9rem 0 0;
      max-width: 62ch;
      color: #d7e2dd;
      font-size: 1rem;
    }
    .btn-lead {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      align-self: flex-start;
      margin-top: 1.5rem;
      background: var(--accent);
      color: var(--ink);
      font-family: var(--f-display);
      font-size: 1.15rem;
      padding: 0.55rem 1.4rem;
      border: 2px solid var(--ink);
      transition: background 0.25s ease, gap 0.25s ease;
    }
    .btn-lead svg { transition: transform 0.3s ease; }
    .btn-lead:hover { background: var(--accent-2); }
    .btn-lead:hover svg { transform: translateX(-5px); }

    /* latest column */
    .latest {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
    }
    .latest-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 3px solid var(--ink);
    }
    .latest-title { font-family: var(--f-display); font-size: 1.5rem; }
    .latest-meta { font-size: 0.74rem; color: var(--ink-faint); }
    .latest-list { list-style: none; margin: 0; padding: 0; flex: 1; }
    .latest-item {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.95rem 1.25rem;
      border-bottom: 1px solid var(--line);
      transition: background 0.25s ease;
    }
    .latest-item:hover { background: var(--paper); }
    .latest-num {
      font-family: var(--f-display);
      font-size: 1.9rem;
      line-height: 1;
      min-width: 2.3rem;
      color: rgba(13, 92, 82, 0.4);
      transition: color 0.25s ease;
    }
    .latest-item:hover .latest-num { color: var(--accent); }
    .latest-body { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; min-width: 0; }
    .latest-item-title {
      font-weight: 700;
      font-size: 0.96rem;
      line-height: 1.5;
      transition: color 0.25s ease;
    }
    .latest-item:hover .latest-item-title { color: var(--brand); }
    .latest-item-meta { font-size: 0.7rem; color: var(--ink-faint); }
    .latest-arr { color: var(--brand); opacity: 0; transform: translateX(6px); transition: opacity 0.25s, transform 0.25s; flex: 0 0 auto; }
    .latest-item:hover .latest-arr { opacity: 1; transform: translateX(0); }
    .latest-empty { padding: 1.4rem 1.25rem; color: var(--ink-faint); font-size: 0.9rem; }

    .stats { display: flex; background: var(--ink); }
    .stat {
      flex: 1;
      text-align: center;
      padding: 1rem 0.4rem;
    }
    .stat + .stat { border-inline-start: 1px dashed rgba(255, 255, 255, 0.16); }
    .stat b { display: block; font-family: var(--f-display); font-size: 1.9rem; color: var(--accent); line-height: 1.1; }
    .stat span { display: block; font-size: 0.7rem; color: #bcd3cb; margin-top: 0.2rem; }

    /* -------------------------------------------------------------- engine bar */
    .engine {
      margin-top: 2.4rem;
      background-color: var(--brand-2);
      background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0 10px, transparent 10px 20px);
      color: #dff3ec;
      border-block: 1px solid rgba(255, 255, 255, 0.08);
      animation: drift 26s linear infinite;
    }
    .engine-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.1rem 1.6rem;
      padding: 0.95rem 1rem;
      font-size: 0.82rem;
    }
    .engine-item { display: inline-flex; align-items: center; gap: 0.45rem; }
    .engine-item b { color: var(--accent); font-weight: 600; }
    .engine-ok { color: #7ee2b8 !important; }
    .engine-sep { color: var(--accent); font-size: 0.5rem; opacity: 0.7; }

    /* ----------------------------------------------------------------- archive */
    .archive { margin-top: 3rem; padding-bottom: 1rem; scroll-margin-top: 1.5rem; }
    .archive-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .sec-title {
      font-family: var(--f-display);
      font-size: 2.1rem;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sec-title::before {
      content: "";
      display: inline-block;
      width: 0.45em; height: 0.45em;
      background: var(--accent);
    }
    .archive-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
    .archive-count { font-size: 0.78rem; color: var(--ink-faint); }
    .search-wrap { position: relative; width: min(360px, 100%); }
    .search-icon {
      position: absolute;
      top: 50%;
      right: 0.85rem;
      transform: translateY(-50%);
      color: var(--ink-faint);
      pointer-events: none;
    }
    #archive-search {
      width: 100%;
      font-family: var(--f-body);
      font-size: 0.92rem;
      color: var(--ink);
      background: var(--card);
      border: 2px solid var(--ink);
      padding: 0.65rem 2.6rem 0.65rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #archive-search::placeholder { color: var(--ink-faint); }
    #archive-search:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(13, 92, 82, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.4rem;
      margin-top: 1.6rem;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      overflow: hidden;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 4px;
      background: var(--accent);
      transform: scaleX(0.18);
      transform-origin: right;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 3;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px -14px rgba(16, 26, 36, 0.28); }
    .card:hover::before { transform: scaleX(1); }
    .card.is-hidden { display: none; }

    .card-media { display: block; aspect-ratio: 16 / 9; overflow: hidden; border-bottom: 1px solid var(--line); }
    .card-media img {
      width: 100%; height: 100%;
      object-fit: cover;
      filter: saturate(0.88);
      transition: transform 0.8s ease, filter 0.5s ease;
    }
    .card:hover .card-media img { transform: scale(1.06); filter: saturate(1); }

    .card-body { display: flex; flex-direction: column; flex: 1; padding: 1.2rem 1.3rem 1.3rem; }
    .badges { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.7rem; }
    .badge {
      font-family: var(--f-mono);
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.2rem 0.55rem;
      border: 1px solid;
    }
    .badge-src { text-transform: uppercase; color: var(--ink); border-color: var(--ink); }
    .badge-ok { background: #e8f6ef; color: var(--brand-2); border-color: #bfe3d2; }
    .badge-warn { background: #fdecec; color: var(--signal); border-color: #f3c0c2; }

    .card-title { margin: 0; font-family: var(--f-display); font-size: 1.4rem; line-height: 1.5; }
    .card-title a { transition: color 0.25s ease; }
    .card-title a:hover { color: var(--brand); }
    .card-en {
      margin: 0.25rem 0 0;
      font-family: var(--f-mono);
      font-size: 0.74rem;
      font-style: italic;
      color: var(--ink-faint);
      direction: ltr;
      text-align: right;
    }
    .card-excerpt { margin: 0.6rem 0 0; font-size: 0.9rem; color: var(--ink-soft); line-height: 1.95; flex: 1; }
    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-top: 0.9rem;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--line);
    }
    .card-foot time { font-size: 0.74rem; color: var(--ink-faint); }
    .card-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--brand);
    }
    .card-cta .arr { transition: transform 0.3s ease; }
    .card:hover .card-cta .arr { transform: translateX(-5px); }

    .empty {
      text-align: center;
      border: 2px dashed var(--line);
      background: var(--card);
      padding: 3rem 1.5rem;
      margin-top: 1.6rem;
    }
    .empty-title { font-family: var(--f-display); font-size: 1.6rem; margin: 0 0 0.4rem; }
    .empty-sub { margin: 0; color: var(--ink-soft); font-size: 0.92rem; }
    .link-btn {
      font-family: var(--f-body);
      font-weight: 700;
      color: var(--brand);
      background: none;
      border: none;
      border-bottom: 2px solid var(--accent);
      cursor: pointer;
      padding: 0;
    }
    .link-btn:hover { color: var(--brand-2); }

    /* ----------------------------------------------------------------- footer */
    .footer {
      position: relative;
      overflow: hidden;
      margin-top: 3.5rem;
      background-color: var(--ink);
      background-image: var(--dots-dark);
      background-size: 9px 9px;
      color: #cdd9d4;
      border-top: 4px solid var(--accent);
    }
    .footer::after {
      content: "رای‌نیوز";
      position: absolute;
      bottom: -0.28em;
      left: -0.04em;
      font-family: var(--f-display);
      font-size: clamp(8rem, 22vw, 16rem);
      line-height: 1;
      color: rgba(255, 255, 255, 0.035);
      pointer-events: none;
      z-index: 0;
    }
    .footer-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.6fr 1fr 1fr;
      gap: 2rem;
      padding-block: 3rem 2rem;
    }
    .footer-logo {
      font-family: var(--f-display);
      font-size: 2.4rem;
      margin: 0 0 0.8rem;
      color: #fff;
    }
    .footer-about { margin: 0; font-size: 0.92rem; line-height: 2; max-width: 42ch; color: #aebdb7; }
    .footer-head {
      font-family: var(--f-mono);
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      color: var(--accent);
      margin: 0 0 0.9rem;
    }
    .footer-links { display: flex; flex-direction: column; gap: 0.35rem; }
    .footer-links a { color: #b9c9c3; font-size: 0.92rem; transition: color 0.2s; }
    .footer-links a:hover { color: var(--accent); }
    .tech-line { margin: 0; font-size: 0.82rem; line-height: 1.9; color: #aebdb7; }
    .tech-status { display: inline-flex; align-items: center; gap: 0.5rem; margin: 1rem 0 0; font-size: 0.78rem; color: #cdd9d4; }
    .footer-bottom {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding-block: 1.2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.8rem;
      color: #8ea09a;
    }
    .footer-bottom .mono { font-size: 0.74rem; }

    /* ===================================================== article detail page */
    #progress {
      position: fixed;
      top: 0; right: 0;
      height: 3px;
      width: 0;
      background: var(--accent);
      z-index: 70;
      transition: width 0.1s linear;
    }
    .article-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--ink);
      color: var(--paper);
      border-bottom: 2px solid var(--accent);
    }
    .article-topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 0.7rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: #e8efec;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { transition: transform 0.25s; }
    .back-link:hover svg { transform: translateX(4px); }
    .mini-logo { font-family: var(--f-display); font-size: 1.5rem; color: #fff; }

    .article { padding-block: 2.2rem 1rem; }
    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }
    .meta-date { font-size: 0.8rem; color: var(--ink-faint); }
    .meta-read {
      font-size: 0.74rem;
      color: var(--brand-2);
      background: #e8f6ef;
      border: 1px solid #bfe3d2;
      padding: 0.18rem 0.6rem;
    }
    .article-title {
      margin: 1.2rem 0 0;
      font-family: var(--f-display);
      font-size: clamp(2.1rem, 5vw, 3.8rem);
      line-height: 1.32;
      max-width: 24ch;
    }
    .article-en {
      margin: 0.5rem 0 0;
      font-family: var(--f-mono);
      font-size: clamp(0.85rem, 1.5vw, 1.05rem);
      color: var(--ink-faint);
      direction: ltr;
      text-align: right;
      letter-spacing: 0.01em;
    }
    .article-hero {
      position: relative;
      margin: 1.8rem 0 0;
      border: 1px solid var(--ink);
    }
    .article-hero img {
      width: 100%;
      height: clamp(256px, 40vw, 384px);
      object-fit: cover;
      filter: saturate(0.92);
    }
    .article-hero figcaption {
      position: absolute;
      bottom: 0.6rem; left: 0.6rem;
      background: var(--ink);
      color: var(--paper);
      font-size: 0.68rem;
      padding: 0.25rem 0.6rem;
    }

    .fact-check {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      margin-top: 1.6rem;
      padding: 1.1rem 1.3rem;
      border: 1px solid #bfe3d2;
      border-left: 5px solid var(--mint);
      background: #e9f7f0;
    }
    .fact-check.pending {
      border-color: #ffd98f;
      border-left-color: var(--accent);
      background: #fff6e3;
    }
    .fact-icon { color: var(--mint); flex: 0 0 auto; margin-top: 0.1rem; }
    .fact-check.pending .fact-icon { color: var(--accent); }
    .fact-title { margin: 0 0 0.3rem; font-weight: 900; font-size: 0.95rem; color: var(--brand-2); }
    .fact-check.pending .fact-title { color: #8a5a00; }
    .fact-text { margin: 0; font-size: 0.92rem; color: #2c4a3e; line-height: 1.95; }
    .fact-check.pending .fact-text { color: #5e4410; }

    .bilingual {
      display: grid;
      grid-template-columns: 1.12fr 0.95fr;
      gap: 1.5rem;
      align-items: start;
      margin-top: 2rem;
    }
    .col-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid var(--ink);
      font-weight: 800;
      font-size: 0.85rem;
    }
    .col-label .mono { color: var(--ink-faint); font-weight: 500; }

    .col-fa {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 1.8rem 2rem;
    }
    .prose p { margin: 0 0 1.1rem; text-align: justify; font-size: 1.02rem; line-height: 2.15; }
    .prose p:last-child { margin-bottom: 0; }
    .prose > p:first-child::first-letter {
      font-family: var(--f-display);
      font-size: 3.2em;
      float: right;
      line-height: 0.82;
      margin-left: 0.16em;
      margin-top: 0.06em;
      color: var(--brand);
    }
    .translator-note { margin: 1.4rem 0 0; font-size: 0.74rem; color: var(--ink-faint); }

    .col-en {
      background: var(--ink);
      color: #c9d8d2;
      padding: 1.8rem 2rem;
      position: sticky;
      top: 4.6rem;
      max-height: calc(100vh - 5.8rem);
      overflow: auto;
      direction: ltr;
      text-align: left;
    }
    .col-en .col-label { color: #fff; border-color: rgba(255, 255, 255, 0.25); }
    .col-en .col-label .mono { color: var(--accent); }
    .prose-en p { margin: 0 0 1rem; font-size: 0.92rem; line-height: 1.95; color: #b9ccc5; }
    .prose-en p:last-child { margin-bottom: 0; }
    .col-en::selection { background: var(--accent); color: var(--ink); }
    .col-en::-webkit-scrollbar { width: 8px; }
    .col-en::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); }
    .col-en::-webkit-scrollbar-track { background: transparent; }

    .spec {
      margin-top: 2rem;
      background: var(--ink);
      color: var(--paper);
    }
    .spec-head {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0;
      padding: 0.9rem 1.3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 800;
      font-size: 0.95rem;
    }
    .spec-mark { width: 0.5em; height: 0.5em; background: var(--accent); display: inline-block; }
    .spec-row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.3rem;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
      font-family: var(--f-mono);
      font-size: 0.8rem;
    }
    .spec-row:last-child { border-bottom: none; }
    .spec-key { color: var(--accent); letter-spacing: 0.08em; flex: 0 0 auto; }
    .spec-val { color: #dbe7e2; text-align: left; direction: ltr; word-break: break-word; }
    .spec-val a { color: #63d6a8; border-bottom: 1px dashed rgba(99, 214, 168, 0.5); transition: color 0.2s; }
    .spec-val a:hover { color: var(--accent); }
    .v-true { color: #7ee2b8; }
    .v-pending { color: var(--accent); }

    .related { margin-top: 2.4rem; }
    .related .sec-title { font-size: 1.7rem; margin-bottom: 1rem; }
    .related-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.1rem;
      margin-top: 0.7rem;
      background: var(--card);
      border: 1px solid var(--line);
      transition: border-color 0.25s ease, transform 0.25s ease;
    }
    .related-item:hover { border-color: var(--brand); transform: translateX(-4px); }
    .related-num { font-family: var(--f-display); font-size: 1.4rem; color: rgba(13, 92, 82, 0.45); transition: color 0.25s; flex: 0 0 auto; }
    .related-item:hover .related-num { color: var(--accent); }
    .related-title { flex: 1; font-weight: 700; font-size: 0.96rem; transition: color 0.25s; }
    .related-item:hover .related-title { color: var(--brand); }
    .related-arr { color: var(--brand); opacity: 0; transform: translateX(6px); transition: opacity 0.25s, transform 0.25s; flex: 0 0 auto; }
    .related-item:hover .related-arr { opacity: 1; transform: translateX(0); }

    /* -------------------------------------------------------------------- 404 */
    .nf {
      position: relative;
      min-height: 72vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1rem;
    }
    .nf-kicker { font-size: 0.75rem; color: var(--signal); letter-spacing: 0.3em; margin: 0 0 0.5rem; }
    .nf-num {
      font-family: var(--f-display);
      font-size: clamp(7rem, 22vw, 15rem);
      line-height: 1;
      margin: 0;
      color: var(--ink);
      text-shadow: 6px 6px 0 rgba(255, 176, 32, 0.55), 12px 12px 0 rgba(13, 92, 82, 0.18);
    }
    .stamp {
      display: inline-block;
      border: 3px solid var(--signal);
      color: var(--signal);
      font-family: var(--f-mono);
      font-weight: 600;
      letter-spacing: 0.25em;
      padding: 0.35rem 1.2rem;
      transform: rotate(-7deg);
      margin: 0.6rem 0 1.4rem;
    }
    .nf-msg { font-family: var(--f-display); font-size: 1.9rem; margin: 0 0 0.6rem; }
    .nf-sub { margin: 0 0 1.8rem; color: var(--ink-soft); max-width: 46ch; font-size: 0.95rem; }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--accent);
      color: var(--ink);
      font-family: var(--f-display);
      font-size: 1.15rem;
      padding: 0.6rem 1.5rem;
      border: 2px solid var(--ink);
      transition: background 0.25s ease, gap 0.25s ease;
    }
    .btn-home svg { transition: transform 0.3s ease; }
    .btn-home:hover { background: var(--accent-2); }
    .btn-home:hover svg { transform: translateX(4px); }

    /* --------------------------------------------------------------- reveal */
    .reveal { opacity: 0; }
    .reveal.in { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; animation-delay: var(--d, 0ms); }

    /* -------------------------------------------------------------- keyframes */
    @keyframes tick { from { transform: translateX(0); } to { transform: translateX(50%); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.15; } }
    @keyframes ring { from { transform: scale(0.5); opacity: 0.9; } to { transform: scale(1.6); opacity: 0; } }
    @keyframes kenburns { from { transform: scale(1.02); } to { transform: scale(1.1); } }
    @keyframes drift { to { background-position: 280px 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

    /* ----------------------------------------------------------- responsive */
    @media (max-width: 1020px) {
      .top-grid { grid-template-columns: 1fr; }
      .bilingual { grid-template-columns: 1fr; }
      .col-en { position: static; max-height: none; overflow: visible; }
      .masthead-main { grid-template-columns: 1fr; text-align: center; gap: 1.1rem; padding-block: 1.6rem; }
      .mast-side { flex-direction: row; justify-content: center; gap: 1.6rem; }
      .mast-left { text-align: center; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      .archive-head { flex-direction: column; align-items: stretch; }
      .archive-tools { align-items: stretch; }
      .search-wrap { width: 100%; }
      .utility-bar { justify-content: center; text-align: center; }
      .lead-content { padding: 1.5rem; }
      .lead { min-height: 420px; }
      .lead-content { min-height: 420px; }
      .col-fa { padding: 1.4rem; }
      .col-en { padding: 1.4rem; }
      .footer-grid { grid-template-columns: 1fr; gap: 1.6rem; }
      .footer-bottom { flex-direction: column; align-items: flex-start; }
      .engine-inner { gap: 0.7rem 1.1rem; }
      .engine-sep { display: none; }
      .mast-side { flex-direction: column; gap: 0.3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001s !important;
        scroll-behavior: auto !important;
      }
      .ticker-track { animation: none; }
      .reveal { opacity: 1; }
      .reveal.in { animation: none; }
    }
  </style>

  {% block head_extra %}{% endblock %}
</head>
<body>
  <a href="#main-content" class="skip-link">پرش به محتوای اصلی</a>

  {% block content %}{% endblock %}

  <script>
    /* =========================================================================
       رای‌نیوز — RighNews · main.js
       Live search · scroll reveal · counters · reading progress · live clock
       ========================================================================= */
    (function () {
      "use strict";

      var FA = "۰۱۲۳۴۵۶۷۸۹";
      function faNum(v) {
        return String(v).replace(/\d/g, function (d) { return FA[+d]; });
      }
      function norm(s) {
        return (s || "")
          .toLowerCase()
          .replace(/ي/g, "ی")
          .replace(/ك/g, "ک")
          .replace(/[‌\s]+/g, " ")
          .trim();
      }

      /* ---- 1. scroll reveal ------------------------------------------------- */
      var revealEls = document.querySelectorAll(".reveal");
      if ("IntersectionObserver" in window) {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) {
              en.target.classList.add("in");
              io.unobserve(en.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
        revealEls.forEach(function (el) { io.observe(el); });
      } else {
        revealEls.forEach(function (el) { el.classList.add("in"); });
      }

      /* ---- 2. live search --------------------------------------------------- */
      var searchInput = document.getElementById("archive-search");
      var grid = document.getElementById("archive-grid");
      var countEl = document.getElementById("archive-count");
      var emptyEl = document.getElementById("archive-empty");
      var resetBtn = document.getElementById("archive-reset");

      if (searchInput && grid) {
        var cards = Array.prototype.slice.call(grid.querySelectorAll(".card"));
        var total = cards.length;
        var emptyTitle = emptyEl ? emptyEl.querySelector(".empty-title") : null;

        var apply = function () {
          var q = norm(searchInput.value);
          var visible = 0;
          cards.forEach(function (card) {
            var hit = !q || norm(card.getAttribute("data-search") || "").indexOf(q) !== -1;
            card.classList.toggle("is-hidden", !hit);
            if (hit) visible++;
          });
          if (countEl) countEl.textContent = "نمایش " + faNum(visible) + " از " + faNum(total) + " پرونده";
          if (emptyEl) emptyEl.hidden = visible !== 0;
          if (emptyTitle) {
            emptyTitle.textContent = q
              ? "چیزی برای «" + searchInput.value.trim() + "» پیدا نشد"
              : "چیزی در آرشیو پیدا نشد";
          }
        };

        searchInput.addEventListener("input", apply);
        if (resetBtn) {
          resetBtn.addEventListener("click", function () {
            searchInput.value = "";
            apply();
            searchInput.focus();
          });
        }
        document.addEventListener("keydown", function (e) {
          var active = document.activeElement;
          if (e.key === "/" && active !== searchInput && active.tagName !== "INPUT" && active.tagName !== "TEXTAREA") {
            e.preventDefault();
            searchInput.focus();
            searchInput.scrollIntoView({ block: "center", behavior: "smooth" });
          } else if (e.key === "Escape" && active === searchInput) {
            searchInput.value = "";
            apply();
            searchInput.blur();
          }
        });
      }

      /* ---- 3. animated counters -------------------------------------------- */
      function runCounter(el) {
        var target = parseInt(el.getAttribute("data-count") || "0", 10) || 0;
        var suffix = el.getAttribute("data-suffix") || "";
        var dur = 1300, t0 = performance.now();
        function step(t) {
          var p = Math.min(1, (t - t0) / dur);
          var eased = 1 - Math.pow(1 - p, 3);
          el.textContent = faNum(Math.round(target * eased)) + suffix;
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
      var counters = document.querySelectorAll(".counter");
      if ("IntersectionObserver" in window && counters.length) {
        var cio = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) { runCounter(en.target); cio.unobserve(en.target); }
          });
        }, { threshold: 0.5 });
        counters.forEach(function (el) { cio.observe(el); });
      } else {
        counters.forEach(runCounter);
      }

      /* ---- 4. reading progress (article page) ------------------------------ */
      var progress = document.getElementById("progress");
      if (progress) {
        var onScroll = function () {
          var doc = document.documentElement;
          var max = doc.scrollHeight - doc.clientHeight;
          progress.style.width = (max > 0 ? (doc.scrollTop / max) * 100 : 0) + "%";
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }

      /* ---- 5. Tehran live clock -------------------------------------------- */
      var clock = document.getElementById("live-clock");
      if (clock) {
        try {
          var fmt = new Intl.DateTimeFormat("fa-IR", {
            timeZone: "Asia/Tehran",
            hour: "2-digit", minute: "2-digit", second: "2-digit"
          });
          var tick = function () { clock.textContent = fmt.format(new Date()); };
          tick();
          setInterval(tick, 1000);
        } catch (e) { /* ignore */ }
      }

      /* ---- 6. image fallback ----------------------------------------------- */
      var PH_SVG =
        "<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450'>" +
        "<defs><pattern id='d' width='14' height='14' patternUnits='userSpaceOnUse'>" +
        "<circle cx='2' cy='2' r='1.4' fill='#0d5c52' opacity='.18'/></pattern></defs>" +
        "<rect width='800' height='450' fill='#e9eeec'/><rect width='800' height='450' fill='url(#d)'/>" +
        "<rect width='800' height='10' fill='#ffb020'/>" +
        "<text x='400' y='250' font-family='Lalezar,Vazirmatn,sans-serif' font-size='84' " +
        "fill='#0d5c52' text-anchor='middle'>رای‌نیوز</text></svg>";
      var PH = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(PH_SVG);
      document.querySelectorAll("img[data-fallback]").forEach(function (im) {
        im.addEventListener("error", function () {
          if (im.src !== PH) im.src = PH;
        }, { once: true });
      });
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
